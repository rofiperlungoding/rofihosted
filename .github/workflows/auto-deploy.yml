name: Auto-deploy to phone

# Gate: deploy ONLY after zig-ci passes on main. Previously this fired on push
# in parallel with CI, so a commit that broke the on-device build could still
# be sent to the phone (which would then fail to rebuild). Chaining off
# zig-ci's success means a red build never reaches the device.
on:
  workflow_run:
    workflows: ["zig-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Don't queue duplicate deploys; if a new push comes in while we're deploying,
# cancel the old run and start fresh with the latest commit.
concurrency:
  group: auto-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run fires on every CI completion (success OR failure); only
    # proceed when CI was green. Manual dispatch always allowed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the phone to fetch the new commit
        # GitHub takes a moment to make the new HEAD available on origin/main
        # via git fetch. 10s is plenty.
        run: sleep 10

      - name: Trigger /v1/system/update on hp-server
        env:
          API_KEY: ${{ secrets.HP_ADMIN_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::HP_ADMIN_API_KEY secret is not set. Skipping deploy."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          response=$(curl -sS -X POST \
            -H "X-API-Key: $API_KEY" \
            --max-time 240 \
            -w '\nHTTP_STATUS:%{http_code}' \
            https://app.rofihosted.space/v1/system/update || true)

          status=$(echo "$response" | tail -1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          # Cloudflare's tunnel proxy times out at 100s, returning 524.
          # The phone keeps building in the background, so 524 is not a
          # failure - we verify by polling /v1/system/version in the next
          # step. Treat 200 (full success), 524 (CF gave up but phone
          # working), or empty (connection severed during restart) as
          # "probably succeeded".
          case "$status" in
            200)
              if echo "$body" | grep -q '"ok":true'; then
                echo "::notice::Deploy returned 200 ok"
              else
                echo "::error::Deploy returned ok:false"
                exit 1
              fi
              ;;
            524|"")
              echo "::notice::Cloudflare 524 / connection severed - normal during long rebuilds. Verifying..."
              ;;
            *)
              echo "::warning::Unexpected status $status, verifying anyway..."
              ;;
          esac

      - name: Verify hp-server bounced back
        env:
          API_KEY: ${{ secrets.HP_ADMIN_API_KEY }}
          # On workflow_run events github.sha points at the default branch tip,
          # not the commit CI actually validated. head_sha is the real commit;
          # fall back to github.sha for manual dispatch.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Wait for watchdog to respawn (5-15s typically)
          attempts=0
          max_attempts=24  # 2 minutes total
          while [ $attempts -lt $max_attempts ]; do
            sleep 5
            response=$(curl -sS \
              -H "X-API-Key: $API_KEY" \
              --max-time 10 \
              https://app.rofihosted.space/v1/system/version 2>/dev/null || echo '')
            if [ -n "$response" ]; then
              local_sha=$(echo "$response" | grep -oE '"local_sha":"[^"]+"' | cut -d'"' -f4)
              echo "Attempt $((attempts+1)): local_sha=$local_sha (expected starts with ${EXPECTED_SHA:0:7})"
              # Match by prefix because /v1/system/version returns short sha
              expected_prefix="${EXPECTED_SHA:0:7}"
              if [ "$local_sha" = "$expected_prefix" ]; then
                echo "::notice::hp-server is now on $local_sha (matches push HEAD)"
                exit 0
              fi
            fi
            attempts=$((attempts + 1))
          done
          echo "::error::hp-server did not advance to $EXPECTED_SHA within 2 minutes"
          exit 1
