<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<title>Sign in &middot; rofihosted</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a1a1a'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='400' font-size='20' fill='%23f0ede5'>r</text></svg>">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=50">
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=50">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  body {
    display: grid;
    grid-template-columns: 1fr;
    min-height: 100vh;
    padding: 0;
  }
  @media (min-width: 900px) {
    body { grid-template-columns: 1fr 1fr; }
  }

  /* Right pane: form */
  .auth-form-side {
    display: grid; place-items: center;
    padding: 2rem 1.5rem;
    min-height: 100vh;
  }
  .auth-form-wrap { width: 100%; max-width: 380px; }

  /* Left pane: editorial (hidden on small screens) */
  .auth-editorial {
    /* Always-dark brand panel: pin paper/ink locally so the theme tokens
       (which swap between light/dark mode) can't invert this panel. */
    --paper: #f3f1ea;
    --ink: #14161a;
    display: none;
    background: var(--ink);
    color: var(--paper);
    padding: 3rem 3rem 2.5rem;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }
  .auth-editorial::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent 0 28px, rgba(240, 237, 229, .025) 28px 29px),
      repeating-linear-gradient(-45deg, transparent 0 28px, rgba(240, 237, 229, .025) 28px 29px);
    pointer-events: none;
  }
  .auth-editorial > * { position: relative; z-index: 1; }
  @media (min-width: 900px) { .auth-editorial { display: flex; } }
  .auth-brand-row {
    display: flex; align-items: baseline; gap: .15rem;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--paper);
  }
  .auth-brand-row .slash {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
  }
  .auth-quote {
    max-width: 28rem;
    margin: auto 0;
  }
  .auth-quote h2 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--paper);
    margin: 0 0 1rem;
  }
  .auth-quote h2 u {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: .15em;
  }
  .auth-quote p {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    color: rgba(240, 237, 229, .72);
    font-size: 1rem;
    line-height: 1.55;
    margin: 0;
  }
  .auth-foot {
    font-size: .76rem;
    color: rgba(240, 237, 229, .55);
    letter-spacing: .04em;
    display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: .5rem;
  }
  .auth-foot a { color: rgba(240, 237, 229, .85); }
  .auth-foot a:hover { color: var(--paper); }

  /* Form side */
  .top-actions { position: fixed; top: 1rem; right: 1rem; z-index: 10; }
  .auth-mark {
    display: inline-flex; align-items: baseline; gap: .15rem;
    font-family: var(--sans);
    font-weight: 700; font-size: 1rem;
    letter-spacing: .04em; text-transform: uppercase;
    color: var(--text);
    margin-bottom: 2.5rem;
  }
  .auth-mark .slash { font-family: var(--serif); font-style: italic; font-weight: 400; }

  h1.auth-title {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 1.85rem;
    letter-spacing: -0.028em;
    line-height: 1.1;
    margin: 0 0 .5rem;
  }
  .auth-host {
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--text-3);
    margin-bottom: 2rem;
    display: block;
  }

  form { display: flex; flex-direction: column; gap: 1.05rem; }
  .form-row { display: flex; flex-direction: column; }
  .submit-row { margin-top: .8rem; }

  .error {
    background: var(--error-soft);
    border: 1px solid var(--error-soft);
    color: var(--error);
    padding: .8rem 1.1rem;
    border-radius: 12px;
    font-size: .85rem;
    display: flex; align-items: center; gap: .55rem;
    margin-bottom: 1rem;
  }
  .error [class^="icon-"] { font-size: 14px; vertical-align: 0; }

  .meta {
    margin-top: 2rem;
    text-align: left;
    color: var(--text-3);
    font-size: .85rem;
    border-top: 1px solid var(--rule);
    padding-top: 1.4rem;
  }
  .meta a {
    color: var(--text);
    border-bottom: 1px solid transparent;
    transition: border-color .12s ease;
  }
  .meta a:hover { border-bottom-color: var(--ink); }
</style>
</head>
<body>
<div class="top-actions">
  <button class="btn-icon theme-toggle" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<aside class="auth-editorial">
  <a href="/" class="auth-brand-row">ROFIHO<span class="slash">/</span>STED</a>
  <div class="auth-quote">
    <h2>A personal <u>cloud</u>, running on one phone.</h2>
    <p>Sign in to deploy projects, manage secrets, and watch build logs stream in real time.</p>
  </div>
  <div class="auth-foot">
    <span>&copy; 2026 rofihosted</span>
    <span><a href="https://github.com/rofiperlungoding/rofihosted">Source</a> &middot; <a href="https://app.rofihosted.space/api">API</a></span>
  </div>
</aside>

<main class="auth-form-side">
  <div class="auth-form-wrap">
    <a href="/" class="auth-mark">ROFIHO<span class="slash">/</span>STED</a>
    <h1 class="auth-title">Sign in.</h1>
    <span class="auth-host" id="host"></span>

    <div id="err" class="error" style="display:none">
      <i class="icon-exclamation"></i>
      <span>Invalid username or password.</span>
    </div>

    <form method="POST" action="/login/submit" autocomplete="on">
      <input type="hidden" name="next" id="next" value="/">
      <div class="form-row">
        <label class="input-label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label class="input-label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="submit-row">
        <button type="submit" class="btn btn-accent btn-lg" style="width:100%">
          <span>Sign in</span>
          <i class="icon-arrow-right"></i>
        </button>
      </div>
    </form>

    <div class="meta">
      No account? <a href="/signup">Sign up</a> &nbsp;&middot;&nbsp; <a href="/">Return home</a>
    </div>
  </div>
</main>

<script src="https://rofihosted.space/theme.js?v=50"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    if (params.get('error') === '1') document.getElementById('err').style.display = '';
    var next = params.get('next');
    if (next && next.startsWith('/')) document.getElementById('next').value = next;
    document.getElementById('host').textContent = location.host;
  })();
</script>
</body>
</html>
