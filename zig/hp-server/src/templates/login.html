<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23a78bfa'/><text x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='18' fill='%23fff'>r</text></svg>">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=17">
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=17">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  a, a:link, a:visited, a:hover { text-decoration: none !important; }
  a.btn, a.btn:link, a.btn:visited, a.btn:hover, a.btn:active, a.btn:focus,
  button.btn, button.btn:hover, button.btn:focus {
    text-decoration: none !important;
    display: inline-flex !important;
    align-items: center; justify-content: center;
    gap: .5rem; height: 38px; padding: 0 1.05rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font: inherit; font-size: .87rem; font-weight: 500;
    color: var(--text); cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow);
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
  }
  a.btn:hover, button.btn:hover { background: var(--surface-2); border-color: var(--text-3); }
  a.btn:active, button.btn:active { transform: scale(.98); }
  a.btn-accent, a.btn-accent:link, a.btn-accent:visited, a.btn-accent:hover,
  button.btn-accent, button.btn-accent:hover {
    background: var(--accent) !important;
    border-color: var(--accent) !important;
    color: var(--accent-fg) !important;
  }
  a.btn-accent:hover, button.btn-accent:hover { background: var(--accent-2) !important; border-color: var(--accent-2) !important; }
  a.btn-lg, button.btn-lg { height: 46px; padding: 0 1.5rem; font-size: .95rem; }
  a.btn [class^="icon-"], a.btn svg, button.btn [class^="icon-"], button.btn svg { font-size: 13px; vertical-align: 0; flex-shrink: 0; }

  body { display: grid; place-items: center; padding: 1.5rem; }
  .panel-wrap { width: 100%; max-width: 400px; }
  .top-actions { position: fixed; top: 1rem; right: 1rem; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem; text-align: center; }
  .login-brand .brand-mark { width: 44px; height: 44px; border-radius: 11px; font-size: 1.2rem; }
  .login-brand h1 { margin: 0; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.025em; }
  .login-brand p { margin: .35rem 0 0; color: var(--text-3); font-size: .87rem; }
  .login-host { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .82rem; }

  .panel { padding: 1.6rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  .form-row { display: flex; flex-direction: column; }
  .submit-row { margin-top: .5rem; }

  .error {
    background: var(--error-soft);
    border: 1px solid var(--error-soft);
    color: var(--error);
    padding: .7rem 1rem;
    border-radius: 8px;
    font-size: .82rem;
    display: flex; align-items: center; gap: .55rem;
    margin-bottom: 1rem;
  }
  .error [class^="icon-"] { font-size: 14px; vertical-align: 0; }

  .meta { margin-top: 1.5rem; text-align: center; color: var(--text-3); font-size: .78rem; }
  .meta a { color: var(--text-2); transition: color .12s ease; }
  .meta a:hover { color: var(--text); }
</style>
</head>
<body>
<div class="top-actions">
  <button class="btn-icon theme-toggle" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<div class="panel-wrap">
  <div class="login-brand">
    <span class="brand-mark">r</span>
    <div>
      <h1>Sign in to continue</h1>
      <p><span class="login-host" id="host"></span></p>
    </div>
  </div>

  <div class="panel">
    <div id="err" class="error" style="display:none">
      <i class="icon-exclamation"></i>
      <span>Invalid username or password.</span>
    </div>

    <form method="POST" action="/login/submit" autocomplete="on">
      <input type="hidden" name="next" id="next" value="/">
      <div class="form-row">
        <label class="input-label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label class="input-label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="submit-row">
        <button type="submit" class="btn btn-accent btn-lg" style="width:100%">
          <span>Sign in</span>
          <i class="icon-arrow-right"></i>
        </button>
      </div>
    </form>
  </div>

  <div class="meta">
    <a href="https://rofihosted.space">return to home</a>
  </div>
</div>

<script src="https://rofihosted.space/theme.js?v=17"></script>
<script>
  (function () {
    const params = new URLSearchParams(location.search);
    if (params.get('error') === '1') {
      document.getElementById('err').style.display = '';
    }
    const next = params.get('next');
    if (next && next.startsWith('/')) {
      document.getElementById('next').value = next;
    }
    document.getElementById('host').textContent = location.host;
  })();
</script>
</body>
</html>
