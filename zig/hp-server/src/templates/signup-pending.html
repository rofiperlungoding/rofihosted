<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>Awaiting approval - rofihosted</title>
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=35">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=35">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 2rem 1.2rem; }
  .card {
    width: 100%; max-width: 460px; text-align: center;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 14px; padding: 2.6rem 2rem; box-shadow: var(--shadow);
  }
  .icon-orb {
    width: 60px; height: 60px; margin: 0 auto 1.2rem;
    border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center; color: var(--accent);
    font-size: 1.6rem;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 .5rem; letter-spacing: -.022em; }
  p { color: var(--text-2); font-size: .9rem; margin: 0 0 1rem; line-height: 1.6; }
  .meta { font-size: .82rem; color: var(--text-3); margin-top: 1.4rem; }
  .meta a, .meta a:link, .meta a:visited { text-decoration: none !important; color: var(--accent); }
  .meta a:hover { color: var(--accent-2); }
</style>
</head>
<body>
<div class="card">
  <div class="icon-orb"><i class="icon-clock"></i></div>
  <h1>Almost there.</h1>
  <p>Your account is created and waiting for the operator to approve. This usually takes a few hours, sometimes a day.</p>
  <p>You'll be able to log in and deploy projects as soon as it goes through. Check the email you signed up with for the approval notice.</p>
  <div class="meta">
    <a href="/">Back to homepage</a> &nbsp;-&nbsp; <a href="https://app.rofihosted.space/login">Try signing in</a>
  </div>
</div>
</body>
</html>
