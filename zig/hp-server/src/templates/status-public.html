<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rofihosted Status</title>
<meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316191d'/><text x='16' y='23' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-weight='700' font-size='19' fill='%23fbfbfc'>r</text></svg>">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=12">
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=50">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  .hdr { border-bottom: 1px solid var(--rule); background: var(--surface); }
  .hdr-in { max-width: 820px; margin: 0 auto; padding: 1.05rem 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .stwrap { max-width: 820px; margin: 0 auto; padding: 0 1.2rem; }
  main { padding: 2.1rem 0 5rem; }

  .overall { border-radius: var(--radius); padding: 1.35rem 1.5rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.6rem; border: 1px solid var(--border); background: var(--surface); }
  .overall.op { background: var(--success-soft); border-color: var(--success); }
  .overall.deg { background: var(--warning-soft); border-color: var(--warning); }
  .overall.down { background: var(--error-soft); border-color: var(--error); }
  .overall .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
  .overall.op .ic { background: var(--success); } .overall.deg .ic { background: var(--warning); } .overall.down .ic { background: var(--error); }
  .overall h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
  .overall .when { font-size: .85rem; color: var(--text-2); margin-top: .1rem; }

  .grp { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1rem; overflow: hidden; }
  .grp-top { padding: .85rem 1.3rem; border-bottom: 1px solid var(--rule-soft); background: var(--paper-2); font-weight: 700; font-size: .85rem; }
  .cmp { padding: 1.05rem 1.3rem; border-bottom: 1px solid var(--rule-soft); }
  .cmp:last-child { border-bottom: 0; }
  .cmp-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .cmp .nm { font-size: .92rem; font-weight: 600; }
  .cmp .dt { font-size: .76rem; color: var(--text-3); margin-top: .1rem; font-family: var(--mono); }
  .cmp .st { font-size: .83rem; font-weight: 600; display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap; }
  .cmp .st.op { color: var(--success); } .cmp .st.deg { color: var(--warning); } .cmp .st.down { color: var(--error); }
  .bars { display: flex; gap: 2px; height: 26px; margin-top: .8rem; }
  .bars i { flex: 1; border-radius: 2px; background: var(--success); transition: opacity .1s; }
  .bars i.d { background: var(--error); } .bars i.g { background: var(--warning); } .bars i.n { background: var(--rule); }
  .bars i:hover { opacity: .6; }
  .bars-meta { display: flex; justify-content: space-between; margin-top: .45rem; font-size: .72rem; color: var(--text-3); }
  .bars-meta .pct { font-weight: 600; color: var(--text-2); }
  .bars i { cursor: default; }
  .tip { position: fixed; z-index: 100; pointer-events: none; background: #16191d; color: #f3f1ea;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: .6rem .75rem; font-size: .78rem;
    line-height: 1.45; box-shadow: 0 10px 34px rgba(0,0,0,.35); opacity: 0; transition: opacity .1s; max-width: 230px; }
  .tip.show { opacity: 1; }
  .tip .td { font-weight: 700; color: #fff; margin-bottom: .25rem; }
  .tip .ts { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; }
  .tip .ts .d { width: 7px; height: 7px; border-radius: 50%; }
  .tip .ts.op { color: #3fcc7e; } .tip .ts.op .d { background: #3fcc7e; }
  .tip .ts.deg { color: #e8a83a; } .tip .ts.deg .d { background: #e8a83a; }
  .tip .ts.down { color: #ec6464; } .tip .ts.down .d { background: #ec6464; }
  .tip .ts.nd { color: #9aa0ab; } .tip .ts.nd .d { background: #6b7280; }
  .tip .tl { color: #a7aebb; margin-top: .25rem; }

  .stfoot { margin-top: 2.5rem; text-align: center; color: var(--text-3); font-size: .8rem; padding-bottom: 1rem; }
  .stfoot a { color: var(--accent); }
  .ld { text-align: center; color: var(--text-3); padding: 3rem; }
</style>
</head>
<body class="t">

<header class="hdr">
  <div class="hdr-in">
    <a href="https://rofihosted.space" class="brand" style="gap:.65rem">
      <span class="brand-mark">r</span>
      <span style="font-weight:700">rofihosted</span>
      <span aria-hidden="true" style="display:inline-block;width:1px;height:17px;background:var(--rule)"></span>
      <span style="font-weight:500;color:var(--text-3)">Status</span>
    </a>
    <button class="btn-icon theme-toggle" aria-label="Toggle theme" onclick="rhT()">
      <svg class="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<main>
<div class="stwrap">
  <div id="overall" class="overall op">
    <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div><h1 id="overall-title">Checking status...</h1><div class="when" id="overall-when">&nbsp;</div></div>
  </div>
  <div id="groups"><div class="ld">Loading status...</div></div>
  <div class="stfoot">Powered by a phone in a drawer &middot; <a href="https://rofihosted.space">rofihosted.space</a> &middot; refreshes every 60s</div>
</div>
</main>
<div id="tip" class="tip"></div>

<script>
  function rhT(){var d=document.documentElement;var n=d.getAttribute('data-theme')==='light'?'dark':'light';d.classList.add('t');d.setAttribute('data-theme',n);try{localStorage.setItem('rofi.theme',n);}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  var TITLES={operational:'All Systems Operational',degraded:'Degraded Performance',down:'Service Disruption'};
  var ST={from:0,to:0,lat:[]};
  function render(d){
    ST={from:d.history_from||0,to:d.history_to||0,lat:d.history_lat||[]};
    var ov=document.getElementById('overall');
    var cls=d.overall==='down'?'down':(d.overall==='degraded'?'deg':'op');
    ov.className='overall '+cls;
    document.getElementById('overall-title').textContent=TITLES[d.overall]||'Status';
    var dt=new Date((d.updated_at||0)*1000);
    document.getElementById('overall-when').textContent='As of '+dt.toLocaleString()+' \u00b7 refreshes every 60s';
    // group components
    var groups={};var order=[];
    (d.components||[]).forEach(function(c){ if(!groups[c.group]){groups[c.group]=[];order.push(c.group);} groups[c.group].push(c); });
    var html='';
    order.forEach(function(g){
      html+='<div class="grp"><div class="grp-top">'+esc(g)+'</div>';
      groups[g].forEach(function(c){
        var st=c.status==='down'?'down':(c.status==='degraded'?'deg':'op');
        var label=c.status==='down'?'Down':(c.status==='degraded'?'Degraded':'Operational');
        var detail=c.detail?esc(c.detail):'';
        if(c.latency_ms!=null) detail=(detail?detail+' \u00b7 ':'')+c.latency_ms+' ms';
        var bars='';
        var hist=c.history||'';
        for(var i=0;i<hist.length;i++){var ch=hist[i];var cl=ch==='d'?'d':(ch==='g'?'g':(ch==='n'?'n':''));bars+='<i class="'+cl+'" data-i="'+i+'" data-s="'+ch+'"></i>';}
        var pct=(c.uptime!=null)?(c.uptime.toFixed(2)+'% uptime'):'';
        html+='<div class="cmp">'+
          '<div class="cmp-row"><div><div class="nm">'+esc(c.name)+'</div>'+(detail?'<div class="dt">'+detail+'</div>':'')+'</div>'+
          '<div class="st '+st+'">'+label+' <span class="s-dot '+(st==='op'?'ring op':st)+'"></span></div></div>'+
          (bars?('<div class="bars">'+bars+'</div><div class="bars-meta"><span>recent</span>'+(pct?'<span class="pct">'+pct+'</span>':'<span></span>')+'<span>now</span></div>'):'')+
          '</div>';
      });
      html+='</div>';
    });
    document.getElementById('groups').innerHTML=html||'<div class="ld">No components reported.</div>';
  }
  function load(){
    fetch('/api/status',{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){
      document.getElementById('overall-title').textContent='Unable to load status';
      document.getElementById('groups').innerHTML='<div class="ld">Could not reach the status API. Retrying...</div>';
    });
  }
  load(); setInterval(load,60000);

  // Hover tooltip on uptime bars: time + status + latency for that bucket.
  (function(){
    var tip=document.getElementById('tip');
    var groups=document.getElementById('groups');
    var SMAP={u:['op','Operational'],d:['down','Outage'],g:['deg','Degraded'],n:['nd','No data recorded']};
    groups.addEventListener('mouseover',function(e){
      var b=e.target;
      if(b.tagName!=='I'||!b.parentNode||!b.parentNode.classList.contains('bars'))return;
      var i=+b.getAttribute('data-i');
      var ch=b.getAttribute('data-s')||'n';
      var slots=b.parentNode.children.length;
      var t=(ST.from&&ST.to&&slots>1)?(ST.from+Math.round((ST.to-ST.from)*(i/(slots-1)))):0;
      var lat=(ST.lat&&ST.lat[i]!=null)?ST.lat[i]:-1;
      var s=SMAP[ch]||SMAP.n;
      var when=t?new Date(t*1000).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      tip.innerHTML=(when?'<div class="td">'+when+'</div>':'')+
        '<div class="ts '+s[0]+'"><span class="d"></span>'+s[1]+'</div>'+
        ((lat>=0&&ch!=='n')?'<div class="tl">'+lat+' ms response</div>':'');
      tip.classList.add('show');
    });
    groups.addEventListener('mousemove',function(e){
      if(!tip.classList.contains('show'))return;
      var x=Math.min(e.clientX+12,window.innerWidth-240);
      var y=e.clientY-tip.offsetHeight-10;
      if(y<8)y=e.clientY+16;
      tip.style.left=x+'px';tip.style.top=y+'px';
    });
    groups.addEventListener('mouseout',function(e){
      if(e.target.tagName==='I')tip.classList.remove('show');
    });
  })();
</script>
</body>
</html>
