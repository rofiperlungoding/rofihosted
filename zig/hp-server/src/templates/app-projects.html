<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>Projects / rofihosted</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23a78bfa'/><text x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='18' fill='%23fff'>r</text></svg>">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=25">
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=25">
<link rel="stylesheet" href="https://rofihosted.space/app.css?v=25">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  .projects-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem; margin-top: 1.2rem;
  }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
    display: flex; flex-direction: column; gap: .6rem;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
    cursor: pointer;
  }
  .project-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(167,139,250,.08); }
  .project-card .pname { font-size: .95rem; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
  .project-card .psub { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .74rem; color: var(--accent); }
  .project-card .pmeta { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .project-card .pill {
    display: inline-flex; align-items: center; gap: .2rem;
    padding: .15rem .5rem; border-radius: 999px;
    font-size: .65rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    border: 1px solid var(--border-soft); background: var(--surface-2); color: var(--text-3);
  }
  .project-card .pill.rt-static { color: #16a34a; border-color: rgba(22,163,74,.35); }
  .project-card .pill.rt-node { color: #84cc16; border-color: rgba(132,204,22,.35); }
  .project-card .pill.rt-python { color: #3b82f6; border-color: rgba(59,130,246,.35); }
  .project-card .pill.rt-bun { color: #eab308; border-color: rgba(234,179,8,.35); }
  .project-card .pill.st-running { color: #16a34a; border-color: rgba(22,163,74,.35); }
  .project-card .pill.st-failed { color: #ef4444; border-color: rgba(239,68,68,.35); }
  .project-card .pill.st-stopped { color: var(--text-3); }
  .project-card .pill.st-created { color: var(--text-3); }
  .project-card .ptime { font-size: .7rem; color: var(--text-3); margin-top: auto; }

  .empty-state { text-align: center; padding: 4rem 1.5rem; color: var(--text-3); }
  .empty-state h3 { color: var(--text-2); font-weight: 500; margin: 0 0 .5rem; font-size: 1.05rem; }
  .empty-state p { margin: 0 0 1.2rem; font-size: .88rem; line-height: 1.5; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-drawer>
    <a href="/" class="brand"><span class="brand-mark">r</span><span class="brand-text">rofihosted</span></a>
    <div class="nav-section">Workspace</div>
    <a class="nav-link" href="/"><i class="icon-grid"></i>Overview</a>
    <a class="nav-link" href="/status"><i class="icon-chart"></i>Status</a>
    <a class="nav-link" href="/files"><i class="icon-folder"></i>Files</a>
    <a class="nav-link" href="/api"><i class="icon-energy"></i>API</a>
    <a class="nav-link active" href="/projects"><i class="icon-rocket"></i>Projects</a>
    <a class="nav-link" href="/security"><i class="icon-shield"></i>Security</a>
    <div class="nav-spacer"></div>
    <div class="nav-section">Account</div>
    <div class="nav-user"><i class="icon-user"></i><span id="cur-user">loading</span></div>
    <a class="nav-link" href="/settings"><i class="icon-settings"></i>Settings</a>
    <a class="nav-link" href="/logout"><i class="icon-logout"></i>Sign out</a>
  </aside>

  <div class="backdrop" data-drawer-backdrop></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-icon menu-btn" data-action="toggle-drawer" aria-label="Open menu"><i class="icon-menu"></i></button>
        <div class="topbar-text">
          <h1 class="page-title">Projects</h1>
          <p class="page-subtitle">Deploy fullstack apps at <code>&lt;name&gt;.rofihosted.space</code></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-accent btn-sm" id="new-project-btn"><i class="icon-plus"></i><span>New project</span></button>
        <span id="ws-status" class="ws-badge poll"><span class="dot"></span> connecting</span>
        <button class="btn-icon theme-toggle" data-action="toggle-theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div id="projects-list">
      <div class="empty-state">
        <h3>No projects yet</h3>
        <p>Click <strong>New project</strong> to deploy your first app.</p>
      </div>
    </div>
  </main>
</div>

<script src="https://rofihosted.space/theme.js?v=25"></script>
<script src="https://rofihosted.space/app.js?v=25"></script>
<script>
RH.loadCurrentUser();

(function () {
  var escapeHtml = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmtTs = function (t) { if (!t) return '\u2014'; return new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' '); };
  var allProjects = [];

  function renderProjects() {
    var wrap = document.getElementById('projects-list');
    if (!allProjects.length) {
      wrap.innerHTML = '<div class="empty-state"><h3>No projects yet</h3><p>Click <strong>New project</strong> to deploy your first app.</p></div>';
      return;
    }
    var html = '<div class="projects-grid">';
    allProjects.forEach(function (p) {
      var url = 'https://' + p.subdomain + '.rofihosted.space';
      var deployed = p.last_deploy_at ? fmtTs(p.last_deploy_at) : 'never deployed';
      html += '<div class="project-card" data-id="' + escapeHtml(p.id) + '">'
        + '<div class="pname">' + escapeHtml(p.name) + '</div>'
        + '<div class="psub">' + escapeHtml(p.subdomain) + '.rofihosted.space</div>'
        + '<div class="pmeta">'
        +   '<span class="pill rt-' + escapeHtml(p.runtime) + '">' + escapeHtml(p.runtime) + '</span>'
        +   '<span class="pill st-' + escapeHtml(p.status) + '">' + escapeHtml(p.status) + '</span>'
        +   (p.port ? '<span class="pill">:' + p.port + '</span>' : '')
        + '</div>'
        + '<div class="ptime">' + escapeHtml(deployed) + '</div>'
        + '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
    wrap.querySelectorAll('.project-card').forEach(function (card) {
      card.addEventListener('click', function () { window.location.href = '/projects?id=' + card.dataset.id; });
    });
  }

  function loadProjects() {
    fetch('/api/projects').then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) { allProjects = j.projects || []; renderProjects(); }
    });
  }

  document.getElementById('new-project-btn').addEventListener('click', function () {
    // For now, redirect to a simple prompt-based flow. The full Netlify-style
    // wizard will be a separate page (/projects/new) in a future iteration.
    var repo = prompt('Git repo URL (leave empty for upload-only):');
    if (repo === null) return;
    var name = prompt('Project name:', '');
    if (!name) return;
    var sub = prompt('Subdomain (lowercase, a-z0-9 and dashes):', name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, ''));
    if (!sub) return;
    var runtime = prompt('Runtime (static / node / python / bun / generic):', 'static');
    if (!runtime) return;

    var fd = new FormData();
    fd.append('name', name);
    fd.append('subdomain', sub);
    fd.append('repo_url', repo || '');
    fd.append('runtime', runtime);
    fd.append('branch', 'main');
    fetch('/api/projects/create', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { alert('Create failed: ' + (j.err || 'unknown')); return; }
        loadProjects();
        if (repo) {
          // Auto-deploy
          var fd2 = new FormData();
          fd2.append('id', j.id);
          fetch('/api/projects/deploy', { method: 'POST', body: fd2 });
        }
      });
  });

  loadProjects();
})();
</script>
</body>
</html>
