<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<title>404 &middot; rofihosted</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a1a1a'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='400' font-size='20' fill='%23f0ede5'>r</text></svg>">
<link rel="stylesheet" href="https://rofihosted.space/icons.css?v=41">
<link rel="stylesheet" href="https://rofihosted.space/theme.css?v=41">
<script>(function(){try{var t=localStorage.getItem('rofi.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  body { display: grid; place-items: center; padding: 2rem 1.5rem; min-height: 100vh; text-align: left; }
  .nf-wrap { max-width: 520px; }
  .nf-mark {
    display: inline-flex; align-items: baseline; gap: .15rem;
    font-family: var(--sans);
    font-weight: 700; font-size: 1rem;
    letter-spacing: .04em; text-transform: uppercase;
    color: var(--text);
    margin-bottom: 3rem;
  }
  .nf-mark .slash { font-family: var(--serif); font-style: italic; font-weight: 400; }
  .num {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(5rem, 13vw, 9rem);
    font-weight: 400;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.04em;
    margin: 0 0 1.6rem;
    font-variation-settings: "opsz" 144;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    margin: 0 0 1rem;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  h1 u {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: .15em;
  }
  p {
    color: var(--text-2);
    line-height: 1.6;
    margin: 0 0 2rem;
    font-size: .98rem;
    font-family: var(--serif);
    font-style: italic;
  }
  .top-actions { position: fixed; top: 1rem; right: 1rem; }
  .nf-foot {
    margin-top: 2.4rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--rule);
    color: var(--text-3);
    font-size: .82rem;
  }
</style>
</head>
<body>
<div class="top-actions">
  <button class="btn-icon theme-toggle" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>
<div class="nf-wrap">
  <a href="/" class="nf-mark">ROFIHO<span class="slash">/</span>STED</a>
  <div class="num">404</div>
  <h1>Page <u>not found</u>.</h1>
  <p>The path you requested does not match any handler. Check the URL, or return to home.</p>
  <a class="btn btn-accent btn-lg" href="https://rofihosted.space">
    <i class="icon-arrow-left"></i>
    <span>Back to home</span>
  </a>
  <div class="nf-foot">rofihosted, powered by Zig.</div>
</div>
<script src="https://rofihosted.space/theme.js?v=41"></script>
</body>
</html>
